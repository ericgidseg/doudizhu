name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号 (如 v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14          # Apple Silicon runner, 打 arm64 包
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      # Python 版斗地主 (DouZero AI) 用 PyInstaller 打包
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deps
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller aiohttp onnxruntime numpy

      - name: Build .app
        working-directory: python
        run: ./build-app.sh

      - name: Verify artifact
        working-directory: python
        run: |
          ls -lh dist/
          test -f "dist/斗地主.app/Contents/MacOS/launcher"
          test -f "dist/斗地主.app/Contents/Resources/_internal/斗地主"
          test -f "dist/doudizhu-py.app.zip"
          file "dist/斗地主.app/Contents/Resources/_internal/斗地主"

          # 模型的真实位置: PyInstaller 6.x 的 onedir 自带 _internal/, 而
          # build-app.sh 又把 dist/斗地主 命名为 .../Resources/_internal/, 所以
          # --add-data 的数据落在 _internal/_internal/ 下. 运行时用
          # sys._MEIPASS 定位, 与嵌套路径自洽 (已实测 ONNX 投票集成正常).
          # 路径写死成扁平会让这步误判失败 —— 用 find 兜住两种布局.
          for m in models models_best models_sl models_wp_backup; do
            found=$(find "dist/斗地主.app" -type f -path "*/$m/landlord.onnx" | head -1)
            test -n "$found" || { echo "❌ 缺少 $m/landlord.onnx"; exit 1; }
            echo "  $m -> ${found#dist/斗地主.app/Contents/Resources/}"
          done

      - name: Create Release & upload zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: 斗地主 ${{ steps.tag.outputs.value }}
          body: |
            macOS Apple Silicon (arm64) 一键包 (Python 版 · DouZero AI).

            **用法**: 下载 `doudizhu-py.app.zip` → 解压 → 双击 `斗地主.app`.
            首次打开如被 Gatekeeper 拦: 右键 → 打开 → 打开.
            启动后终端窗口保持开着, 浏览器打开打印的内网地址即可开局.

            源码版: `cd python && pip install aiohttp onnxruntime numpy && python3 server.py`.
          files: python/dist/doudizhu-py.app.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
