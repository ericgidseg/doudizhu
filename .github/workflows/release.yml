name: Release

on:
  push:
    tags: ['v*']
  repository_dispatch:
    types: [star]              # 由 star-webhook Worker 触发
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号 (如 v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false    # star 触发密集时排队不取消, 但同组串行防刷屏

jobs:
  build-macos:
    runs-on: macos-14          # Apple Silicon runner, 打 arm64 包
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0         # 需要全部 tag 来推版本号

      # star 触发时自动算版本: 读最新 tag, 次版本号 +1
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # star / 无输入 -> latest tag 次版本 +1
            git fetch --tags --force >/dev/null 2>&1 || true
            LATEST=$(git tag -l 'v*' | sort -V | tail -1)
            LATEST=${LATEST:-v0.0.0}
            IFS=. read -r MA MI PA <<< "${LATEST#v}"
            echo "value=v${MA}.$((MI+1)).0" >> "$GITHUB_OUTPUT"
          fi

      # runner 自带 node (arm64). 确认版本够用 (SEA 不需要, 只要 >=16).
      - name: Node version
        run: node -v && file "$(command -v node)"

      - name: Build .app
        run: ./build-app.sh

      - name: Verify artifact
        run: |
          ls -lh dist/
          test -f "dist/斗地主.app/Contents/MacOS/launcher"
          test -f "dist/斗地主.app/Contents/Resources/node"
          test -f "dist/doudizhu.app.zip"
          file "dist/斗地主.app/Contents/Resources/node"

      - name: Create Release & upload zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: 斗地主 ${{ steps.tag.outputs.value }}
          body: |
            macOS Apple Silicon (arm64) 一键包.

            **用法**: 下载 `doudizhu.app.zip` → 解压 → 双击 `斗地主.app`.
            首次打开如被 Gatekeeper 拦: 右键 → 打开 → 打开.
            启动后终端窗口保持开着, 浏览器打开打印的内网地址即可开局.

            源码版: clone 本仓库后 `node server.js`.
          files: dist/doudizhu.app.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
