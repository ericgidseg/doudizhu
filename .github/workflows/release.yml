name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号 (如 v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14          # Apple Silicon runner, 打 arm64 包
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      # Python 版斗地主 (DouZero AI) 用 PyInstaller 打包
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install deps
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller aiohttp onnxruntime numpy

      # 两份前端 (public/ 与 python/public/) 有意保留三处差异 (ws 路径 /
      # turnBanner / 倒计时), 但牌面渲染这类共享逻辑必须两边相同.
      # 历史上因漏改出过三次事故: 编码错位、牌序只改 Node 版、发布的版本落后
      # 于修复. 放在构建前, 漂移时不让发版.
      - name: Check frontend parity
        run: ./tools/check_frontend_parity.sh

      - name: Build .app
        working-directory: python
        run: ./build-app.sh

      - name: Verify artifact
        working-directory: python
        run: |
          ls -lh dist/
          test -f "dist/斗地主.app/Contents/MacOS/launcher"
          test -f "dist/斗地主.app/Contents/Resources/_internal/斗地主"
          test -f "dist/doudizhu-py.app.zip"
          file "dist/斗地主.app/Contents/Resources/_internal/斗地主"
          # 四个模型目录都在 _internal/ 直属: build-app.sh 用
          # --contents-directory . 拍平了 PyInstaller 的 onedir 布局, 否则
          # 数据会被收进 _internal/_internal/ (运行时靠 sys._MEIPASS 才不坏).
          # 少任何一个都会让 ONNX 加载失败 —— 宁可在这步拦住, 别带病发版.
          for m in models models_best models_sl models_wp_backup; do
            test -f "dist/斗地主.app/Contents/Resources/_internal/$m/landlord.onnx"
          done
          echo "✅ launcher / 可执行文件 / 4 组模型 / zip 全部就位"

      - name: Create Release & upload zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: 斗地主 ${{ steps.tag.outputs.value }}
          body: |
            macOS Apple Silicon (arm64) 一键包 (Python 版 · DouZero AI).

            **用法**: 下载 `doudizhu-py.app.zip` → 解压 → 双击 `斗地主.app`.
            首次打开如被 Gatekeeper 拦: 右键 → 打开 → 打开.
            启动后终端窗口保持开着, 浏览器打开打印的内网地址即可开局.

            源码版: `cd python && pip install aiohttp onnxruntime numpy && python3 server.py`.
          files: python/dist/doudizhu-py.app.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
